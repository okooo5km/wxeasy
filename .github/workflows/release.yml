name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: Copy-Item "target\x86_64-pc-windows-msvc\release\wxeasy.exe" "wxeasy-windows-x86_64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: wxeasy-windows-x86_64
          path: wxeasy-windows-x86_64.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wxeasy-windows-x86_64.exe
