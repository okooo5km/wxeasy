name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: wxeasy-windows-x86_64.exe
            binary: wxeasy.exe
          - os: macos-14
            target: aarch64-apple-darwin
            asset: wxeasy-macos-arm64
            binary: wxeasy
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: wxeasy-macos-x86_64
            binary: wxeasy
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Check and test
        run: |
          cargo check --locked --target ${{ matrix.target }}
          cargo test --locked --target ${{ matrix.target }}

      - name: Test LLDB capture protocol
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p 'test_macos_capture.py'

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            doc/pandorafuture-MIT.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}

      - name: Upload third-party license
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'aarch64-apple-darwin'
        with:
          files: doc/pandorafuture-MIT.txt

  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --target x86_64-unknown-linux-gnu
